namespace: newrelic
name: com.newrelic.infrastructure.nri_mongodb3
version: 1.0.0
platform: host
operating_system: linux
protocol_version: "1.0"
variables:
  config:
    description: "nri-mongodb3 integration YAML consumed by the infra-agent"
    type: yaml
    required: true
    classification: config
  version:
    description: "Agent version"
    type: string
    required: true
  oci:
    repository:
      description: "OCI repository name for nri-mongodb3"
      type: string
      required: false
      default: newrelic/nri-mongodb3-artifacts
deployment:
  packages:
    nri-mongodb3:
      download:
        oci:
          repository: ${nr-var:oci.repository}
          version: ${nr-var:version}
          public_key_url: https://publickeys.newrelic.com/g/agent-control-oci/global/nri-mongodb3/jwks.json
  shared_filesystem:
    infra-agent-ohi-configs:
      kind: dir
      entries:
        nri-mongodb3.yaml:
          kind: file
          text: |
            ${nr-var:config}
    # nri-mongodb3 resolves the exporter binary from its own folder when it is not found in
    # the default prometheus-exporters path, so both binaries must live in the same directory.
    infra-agent-ohi-binaries:
      kind: dir
      entries:
        nri-mongodb3:
          kind: file
          copy_from_file: ${nr-sub:packages.nri-mongodb3.dir}/nri-mongodb3
        mongodb3-exporter:
          kind: file
          copy_from_file: ${nr-sub:packages.nri-mongodb3.dir}/mongodb3-exporter
