name: e2e Agent Control

# Checks that the package of an exporter and its Agent Control agent type work together by deploying them in a
# real Agent Control. The exporter needs exporters/<exporter>/.fleetControl and exporters/<exporter>/e2e/agent-control.yml.
# See https://github.com/newrelic/newrelic-agent-control/pull/2998
on:
  workflow_dispatch:
    inputs:
      exporter:
        description: 'Name of the exporter to test'
        required: false
        default: mongodb3
        type: string
      agent_control_version:
        description: 'Agent Control version to install (empty uses the install recipe default)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  GORELEASER_VERSION: 'v1.13.1'
  EXPORTER: ${{ inputs.exporter }}

jobs:
  e2e-agent-control:
    name: Agent Control e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: nri-config-generator/go.mod
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Build the exporter
        run: make build-${EXPORTER}
      - name: Create the package
        # Both binaries are placed at the root of the archive, the agent type reads them from there.
        run: |
          tar czf "${EXPORTER}.tar.gz" \
            -C "exporters/${EXPORTER}/target/bin/linux_amd64" "nri-${EXPORTER}" "${EXPORTER}-exporter"
      - name: Read the e2e definition of the exporter
        id: e2e
        working-directory: exporters/${{ env.EXPORTER }}/e2e
        run: |
          {
            echo "compose_file=$(yq e '.compose_file // ""' agent-control.yml)"
            echo "config_file=exporters/${EXPORTER}/e2e/$(yq e '.config_file' agent-control.yml)"
            echo "nrql_assertion=$(yq e '.nrql_assertion' agent-control.yml)"
          } >> "${GITHUB_OUTPUT}"
      - name: Start the system to monitor
        if: steps.e2e.outputs.compose_file != ''
        working-directory: exporters/${{ env.EXPORTER }}/e2e
        run: docker compose -f "${{ steps.e2e.outputs.compose_file }}" up -d
      # TODO: pin to a released ref once the action is merged
      - uses: newrelic/newrelic-agent-control/.github/actions/test-ohi-agent@gsanchez/feat/e2e-action
        with:
          agent-type-file: exporters/${{ env.EXPORTER }}/.fleetControl/agentControl/linux.yml
          package-file: ${{ env.EXPORTER }}.tar.gz
          config-file: ${{ steps.e2e.outputs.config_file }}
          nrql-assertion: ${{ steps.e2e.outputs.nrql_assertion }}
          nr-license-key: ${{ secrets.COREINT_E2E_LICENSE_KEY }}
          nr-api-key: ${{ secrets.COREINT_E2E_API_KEY }}
          nr-account-id: ${{ secrets.COREINT_E2E_ACCOUNT_ID }}
          agent-control-version: ${{ inputs.agent_control_version }}
