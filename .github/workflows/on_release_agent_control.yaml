name: Publish exporter to Agent Control catalog

# Publishes the released exporter (tag nri-<exporter>-<version>) to the Agent Control catalog: the packages are
# repackaged to contain only the binaries, uploaded to an OCI registry and registered in Agent Metadata.
# An exporter is published only if it has exporters/<exporter>/agent-control.yml, adding a new exporter to the
# catalog does not require changing this workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process (e.g., nri-mongodb3-3.1.8)'
        required: true
        type: string
      metadata_git_ref:
        description: 'Git ref to read the agent type files from, for releases done before the exporter was onboarded. Defaults to the tag.'
        required: false
        default: ''
        type: string
  release:
    types:
      - released

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the Agent Control catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the exporter from the release tag
        id: resolve
        run: ./scripts/agent_control_resolve.sh "${TAG}"

      - name: Repackage the release assets
        id: package
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ steps.resolve.outputs.artifacts }}
        run: |
          ./scripts/agent_control_repackage.sh "${TAG}" "${ARTIFACTS}" "${RUNNER_TEMP}/artifacts"
          {
            echo "binaries_json<<EOF"
            cat "${RUNNER_TEMP}/artifacts/binaries.json"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # Tests the repackaged Linux package together with the agent type in a real Agent Control, so a broken
      # package is not registered in the catalog. It does not affect the release itself, which already exists.
      # Skipped for exporters without exporters/<exporter>/e2e/agent-control.yml.
      - name: Read the e2e definition of the exporter
        id: e2e
        if: steps.resolve.outputs.publish == 'true'
        env:
          EXPORTER: ${{ steps.resolve.outputs.name }}
        run: |
          definition="exporters/${EXPORTER}/e2e/agent-control.yml"
          if [ ! -f "${definition}" ]; then
            echo "::notice::${definition} does not exist, skipping the Agent Control e2e"
            echo "run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "run=true"
            echo "compose_file=$(yq e '.compose_file // ""' "${definition}")"
            echo "config_file=exporters/${EXPORTER}/e2e/$(yq e '.config_file' "${definition}")"
            echo "nrql_assertion=$(yq e '.nrql_assertion' "${definition}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Start the system to monitor
        if: steps.e2e.outputs.run == 'true' && steps.e2e.outputs.compose_file != ''
        working-directory: exporters/${{ steps.resolve.outputs.name }}/e2e
        run: docker compose -f "${{ steps.e2e.outputs.compose_file }}" up -d

      # TODO: pin to a released ref once the action is merged (newrelic/newrelic-agent-control#3043)
      - name: Agent Control e2e
        if: steps.e2e.outputs.run == 'true'
        uses: newrelic/newrelic-agent-control/.github/actions/test-ohi-agent@gsanchez/feat/e2e-action
        with:
          agent-type-file: exporters/${{ steps.resolve.outputs.name }}/.fleetControl/agentControl/linux.yml
          # Both binaries are at the root of the repackaged archive, where the agent type reads them from.
          package-file: ${{ runner.temp }}/artifacts/linux-amd64.tar.gz
          config-file: ${{ steps.e2e.outputs.config_file }}
          nrql-assertion: ${{ steps.e2e.outputs.nrql_assertion }}
          nr-license-key: ${{ secrets.COREINT_E2E_LICENSE_KEY }}
          nr-api-key: ${{ secrets.COREINT_E2E_API_KEY }}
          nr-account-id: ${{ secrets.COREINT_E2E_ACCOUNT_ID }}

      - name: Upload to Agent Metadata
        if: steps.resolve.outputs.publish == 'true'
        uses: newrelic/agent-metadata-action/send-metadata@v1.7.0
        with:
          newrelic-client-id: ${{ secrets.OHAI_NEWRELIC_CLIENT_ID }}
          newrelic-private-key: ${{ secrets.OHAI_NEWRELIC_PRIVATE_KEY }}
          agent-type: ${{ steps.resolve.outputs.agent_type }}
          display-name: ${{ steps.resolve.outputs.display_name }}
          monitoring-type: INFRA
          version: ${{ steps.resolve.outputs.version }}
          git-ref: ${{ inputs.metadata_git_ref || env.TAG }}
          config-directory: ${{ steps.resolve.outputs.config_directory }}
          oci-registry: ${{ steps.resolve.outputs.oci_registry }}
          oci-username: ${{ secrets.OHAI_OCI_USERNAME }}
          oci-password: ${{ secrets.OHAI_OCI_PASSWORD }}
          newrelic-license-key: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }}
          binaries: ${{ steps.package.outputs.binaries_json }}
          tags: '{"on-host-integration": "true"}'
